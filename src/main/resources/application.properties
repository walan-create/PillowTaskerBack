spring.datasource.url=jdbc:mysql://localhost:3306/pillowtasker?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Nombre de la aplicación
spring.application.name=PillowTaskerBack
spring.datasource.generate-unique-name=false

# Hibernate y JPA
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create

# Logging detallado para depuración de transacciones y SQL
#logging.level.org.springframework.transaction=DEBUG
#logging.level.org.springframework.orm.jpa=DEBUG
#logging.level.org.springframework.transaction.interceptor=TRACE
#logging.level.org.springframework.orm.jpa.JpaTransactionManager=TRACE
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE
#logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
#logging.level.org.springframework.security=DEBUG

# Spring Data REST
spring.data.rest.basePath=/data-api

# Jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false